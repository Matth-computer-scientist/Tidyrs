name: Release

# Builds precompiled `tidyloom` binaries for Linux/macOS/Windows and
# attaches them to a GitHub Release. Only runs on a version tag push
# (e.g. `v0.1.0`) — pushing normal commits to main never triggers this.
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tidyloom
            asset_name: tidyloom-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tidyloom
            asset_name: tidyloom-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tidyloom
            asset_name: tidyloom-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tidyloom.exe
            asset_name: tidyloom-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tidyrs-cli --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish-release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
