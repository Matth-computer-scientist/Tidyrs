name: Feature request
description: A new format, output option, or CLI behavior you'd like to see
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas welcome, especially new `TidyParser` implementations —
        see [CONTRIBUTING.md](../../CONTRIBUTING.md#adding-a-new-format) for
        how the trait boundary makes that a self-contained addition.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of feature is this?
      options:
        - New input format
        - New output format / export option
        - CLI flag or behavior change
        - Detection / sniffing improvement
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't currently possible, or that requires an awkward workaround?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead? If this is a new format, a sample of real (anonymized if needed) files in that format would help a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this you've thought about, and why they're worse
    validations:
      required: false
