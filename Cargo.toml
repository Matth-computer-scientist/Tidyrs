[workspace]
resolver = "2"
members = [
    "tidyrs-core",
    "tidyrs-csv",
    "tidyrs-xlsx",
    "tidyrs-pdf",
    "tidyrs-json",
    "tidyrs-fixed",
    "tidyrs-ini",
    "tidyrs-sqlite",
    "tidyrs-orc",
    "tidyrs-parquet",
    "tidyrs-avro",
    "tidyrs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Matth-computer-scientist/Tidyrs"

[workspace.dependencies]
tidyrs-core = { path = "tidyrs-core" }
tidyrs-csv = { path = "tidyrs-csv" }
tidyrs-xlsx = { path = "tidyrs-xlsx" }
tidyrs-pdf = { path = "tidyrs-pdf" }
tidyrs-json = { path = "tidyrs-json" }
tidyrs-fixed = { path = "tidyrs-fixed" }
tidyrs-ini = { path = "tidyrs-ini" }
tidyrs-sqlite = { path = "tidyrs-sqlite" }
tidyrs-orc = { path = "tidyrs-orc" }
tidyrs-parquet = { path = "tidyrs-parquet" }
tidyrs-avro = { path = "tidyrs-avro" }

serde = { version = "1", features = ["derive"] }
# "arbitrary_precision": without it, serde_json's own Number type parses
# an integer literal too big for i64/u64 straight into a lossy f64 *at
# parse time* (confirmed directly: "99999999999999999999999999" becomes
# Number(1e+26) before tidyrs-json's own code ever runs) — no amount of
# post-processing on our side could recover the original digits. This
# preserves the exact source text for oversized numbers instead. See
# tidyrs-json/src/flatten.rs's json_scalar_to_tidy for the other half of
# this fix.
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "1"
anyhow = "1"
