[package]
name = "tidyrs-xlsx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Excel (.xlsx/.xls) parser for tidyloom: merged cells, junk headers/footers, multi-sheet"

[dependencies]
tidyrs-core = { workspace = true }
calamine = { version = "0.26", features = ["dates"] }

[dev-dependencies]
rust_xlsxwriter = "0.96"
proptest = "1"

[[example]]
name = "gen_fixtures_xlsx"
path = "examples/gen_fixtures.rs"
